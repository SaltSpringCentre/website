<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen — Salt Spring Centre of Yoga</title>
<meta name="description" content="Chants, kirtan, and recordings from the Salt Spring Centre of Yoga. Play while browsing the site.">
<!-- OpenGraph + Twitter (og-default.jpg is a placeholder; create 1200x630 PNG and update if needed) -->
<meta property="og:title" content="Listen — Salt Spring Centre of Yoga">
<meta property="og:description" content="Chants, kirtan, and recordings from the Salt Spring Centre of Yoga. Play while browsing the site.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://saltspringcentre.com/player.html">
<meta property="og:image" content="https://saltspringcentre.com/images/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Listen — Salt Spring Centre of Yoga">
<meta name="twitter:description" content="Chants, kirtan, and recordings from the Salt Spring Centre of Yoga. Play while browsing the site.">
<meta name="twitter:image" content="https://saltspringcentre.com/images/og-default.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://bandcamp.com">
<link rel="preconnect" href="https://bandcamp.s3.amazonaws.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Archivo+Narrow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal-deep: #1a5550;
    --teal-dark: #2a6f67;
    --teal: #3bb8a8;
    --gold: #f4d76b;
    --cream: #faf8f4;
    --cream-warm: #f4ecdd;
    --white: #ffffff;
    --text-light: rgba(26,85,80,0.65);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, var(--cream) 0%, var(--cream-warm) 100%);
    font-family: 'Archivo Narrow', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--teal-deep);
    padding: 18px 18px 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap { max-width: 100%; flex: 1; display: flex; flex-direction: column; }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .header img { height: 34px; }
  .header-text { display: flex; flex-direction: column; line-height: 1.2; }
  .header-text .series {
    font-family: 'Archivo Narrow', sans-serif;
    font-size: 0.62rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--teal);
  }
  .header-text .title {
    font-family: 'Cinzel', serif;
    font-size: 0.98rem;
    font-weight: 500;
    color: var(--teal-deep);
    margin-top: 2px;
  }
  .player-frame {
    width: 100%;
    flex: 1;
    min-height: 380px;
    border: 0;
    border-radius: 14px;
    box-shadow: 0 4px 22px rgba(26,85,80,0.14);
    background: var(--white);
    display: block;
  }
  .login-notice {
    margin: 0 0 10px;
    padding: 8px 12px;
    font-size: 0.78rem;
    color: var(--teal-deep);
    background: rgba(244,215,107,0.25);
    border-left: 3px solid var(--gold);
    border-radius: 4px;
    letter-spacing: 0.02em;
    line-height: 1.4;
  }
  .hint {
    margin-top: 12px;
    font-size: 0.7rem;
    color: var(--text-light);
    text-align: center;
    letter-spacing: 0.03em;
    line-height: 1.5;
  }
  .hint strong { color: var(--teal-deep); font-weight: 600; }
  .buy-cta {
    display: flex;
    justify-content: center;
    margin-top: 14px;
  }
  .buy-cta a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--gold);
    color: var(--teal-deep);
    text-decoration: none;
    padding: 9px 22px;
    border-radius: 50px;
    font-family: 'Archivo Narrow', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: 0.2s;
    box-shadow: 0 2px 10px rgba(244,215,107,0.2);
  }
  .buy-cta a:hover { transform: scale(1.04); background: #f9e089; box-shadow: 0 3px 14px rgba(244,215,107,0.45); }
  .buy-cta svg { flex-shrink: 0; }
  @media (max-height: 520px) {
    body { padding: 10px; }
    .header { margin-bottom: 8px; }
    .header img { height: 28px; }
    .player-frame { min-height: 320px; }
    .hint { margin-top: 8px; font-size: 0.66rem; }
  }
.skip-link { position: absolute; left: -9999px; top: 0; z-index: 9999; padding: 12px 18px; background: var(--teal-dark); color: var(--white); font-weight: 600; border-radius: 0 0 6px 0; text-decoration: none; }
.skip-link:focus { left: 0; outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div class="wrap">
  <div class="header">
    <img src="logo-lotus-teal.svg" alt="Salt Spring Centre of Yoga">
    <div class="header-text">
      <span class="series">Listen</span>
      <span class="title">Music from the Centre</span>
    </div>
  </div>
  <iframe
    class="player-frame"
    title="Salt Spring Centre of Yoga on Bandcamp"
    src="https://bandcamp.com/EmbeddedPlayer/album=3022540630/size=large/bgcol=ffffff/linkcol=1a5550/tracklist=true/artwork=small/transparent=true/"
    allow="autoplay"
    loading="lazy"
    seamless><a href="https://saltspringcentre.bandcamp.com/album/41-acyr-kirtan-album">41 ACYR Kirtan Album by Salt Spring Centre of Yoga</a></iframe>
  <div class="buy-cta">
    <a href="https://saltspringcentre.bandcamp.com/album/41-acyr-kirtan-album" target="_blank" rel="noopener">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 9.5 7.5 4 8l4 4-1 6 5-3 5 3-1-6 4-4-5.5-.5z"/></svg>
      Buy on Bandcamp
    </a>
  </div>
  <p class="hint">Keep this window open to play music while you browse <strong>saltspringcentre.com</strong>.</p>
</div>
<script>
  // Heartbeat: the main site uses this timestamp to detect whether the popup is
  // still alive, so re-clicking Play on another page focuses this window rather
  // than opening a new one.
  function beat() {
    try { localStorage.setItem('sscy-player-alive', String(Date.now())); } catch (e) {}
  }
  beat();
  setInterval(beat, 1000);
  window.addEventListener('beforeunload', function () {
    try { localStorage.removeItem('sscy-player-alive'); } catch (e) {}
  });
</script>
</body>
</html>
